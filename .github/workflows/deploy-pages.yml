# Publica Forja en GitHub Pages (gratis para repositorios públicos).
# Se ejecuta al hacer push a main y también a mano (Actions → "Publicar en GitHub Pages" → Run workflow).
# Requisito previo (una sola vez, en la web de GitHub): Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias e integración
        run: npm test
      - name: Tipos + build de producción
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Comprobar que GitHub Pages está activado
        uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
